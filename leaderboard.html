<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaderboard | Lentech French Academy</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .leaderboard-wrap { max-width:980px; margin:2rem auto; padding:1rem }
        .leaderboard-controls { display:flex; gap:0.5rem; align-items:center; margin-bottom:1rem; flex-wrap:wrap }
        .leaderboard-list { display:grid; gap:.5rem }
        .leader-item { display:flex; align-items:center; gap:1rem; padding:.75rem; background:var(--card-bg, #fff); border-radius:8px; box-shadow:var(--shadow-sm); }
        .leader-rank { font-weight:700; width:48px; text-align:center }
        .leader-avatar { width:48px; height:48px; border-radius:50%; background:#eee; display:inline-block; overflow:hidden; }
        .leader-meta { flex:1 }
        .leader-xp { font-weight:700; color:var(--primary) }
        .loading { text-align:center; padding:2rem }
        @media (max-width:600px) {
            .leader-item { padding:.65rem }
            .leader-rank { width:40px }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">🎓 Lentech French Academy</a>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="levels/a1/index.html">Learning</a>
                <a href="certificate.html">Certificates</a>
                <span id="userName"></span>
            </div>
        </div>
    </nav>

    <main class="leaderboard-wrap">
        <h1>🏆 Leaderboard</h1>
        <p>Top learners by XP. Climb the ranks by completing lessons and challenges.</p>

        <div class="leaderboard-controls">
            <input id="searchInput" placeholder="Search learners..." style="flex:1; padding:.5rem; border-radius:6px; border:1px solid #ddd" />
            <label style="display:flex;align-items:center;gap:.5rem"><input type="checkbox" id="friendsOnly" /> Show friends only</label>
            <select id="limitSelect" aria-label="Results per page">
                <option value="10">Top 10</option>
                <option value="25">Top 25</option>
                <option value="50">Top 50</option>
            </select>
        </div>

        <div id="leaderboardContainer">
            <div class="loading" id="leaderLoading">Loading leaderboard…</div>
            <div id="leaderList" class="leaderboard-list" style="display:none"></div>
            <div id="leaderEmpty" style="display:none; text-align:center; padding:2rem">No learners found.</div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/leaderboard.js"></script>
    <!-- Register Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => {
          console.log('Service Worker registered:', registration);
        })
        .catch(error => {
          console.log('Service Worker registration failed:', error);
        });
    });
  }
</script>
</body>
</html>
